# 打 tag（如 v0.1.0）时触发
workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - build
  - release

# ─── Linux（GitLab 免费提供 runner） ───
build-linux:
  stage: build
  image: rust:latest
  tags: [saas-linux-medium-amd64]
  script:
    - cargo build --release
    - cp target/release/figma-mcp figma-mcp-linux-amd64
  artifacts:
    paths:
      - figma-mcp-linux-amd64

# ─── macOS（需要自建 runner，见下方说明） ───
build-macos:
  stage: build
  tags: [macos]           # 你的 Mac runner 的 tag
  script:
    - cargo build --release
    - cp target/release/figma-mcp figma-mcp-darwin-arm64
  artifacts:
    paths:
      - figma-mcp-darwin-arm64

# ─── Windows（需要自建 runner，见下方说明） ───
build-windows:
  stage: build
  tags: [windows]         # 你的 Windows runner 的 tag
  script:
    - cargo build --release
    - copy target\release\figma-mcp.exe figma-mcp-windows-amd64.exe
  artifacts:
    paths:
      - figma-mcp-windows-amd64.exe

# ─── 发布到 GitLab Release ───
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-linux
    - job: build-macos
    - job: build-windows
  script:
    - echo "Creating release"
  release:
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: figma-mcp-linux-amd64
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_LINUX_JOB_ID/artifacts/download"
        - name: figma-mcp-darwin-arm64
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_MACOS_JOB_ID/artifacts/download"
        - name: figma-mcp-windows-amd64
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_WINDOWS_JOB_ID/artifacts/download"

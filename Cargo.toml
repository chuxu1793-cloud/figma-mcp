[package]
name = "figma-mcp"
version = "0.1.0"
edition = "2021"
description = "Figma MCP server with full read/write access via plugin bridge — no API token, no rate limits"
license = "MIT"

[dependencies]
rmcp = { version = "2.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
regex = "1"
base64 = "0.22"
lopdf = "0.34"
futures-util = "0.3"
fastrand = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
